---
name: simStudy
title: Simulated study
menuGroup: Simulate
menuTitle: Simulated study
menuSubtitle: Scenario, design, dataset and answer key
version: '0.4.0'
jas: '1.2'

description:
    main: >
        Simulates a plausible medical study for teaching: a clinical scenario from
        the library, a study design compatible with its outcome, a sample size and
        some realism. The dataset opens in a new window; the answer key holds the
        true parameters and what the design is expected to estimate.
    R:
        dontrun: true
        usage: |
            # in R, use the engine directly:
            # sc <- studysim:::load_scenario(studysim:::builtin_library(), "chd_incidence")
            # studysim:::simulate_study(sc, "chd", "cohort", n = 1000)

options:
    - name: data
      type: Data

    - name: libName
      title: Custom library
      type: String
      default: ""
      description:
          R: name of the custom library file read by the Browse button (display only)

    - name: libContent
      title: Custom library payload
      type: String
      default: ""
      hidden: true
      description:
          R: base64 of the custom library file (JSON, YAML, Excel or zip)

    - name: designFilter
      title: Scenarios for design
      type: List
      options:
          - name: any
            title: Any design
          - name: cross_sectional
            title: Cross-sectional
          - name: ecological
            title: Ecological (regions)
          - name: case_control
            title: Case-control
          - name: matched_cc
            title: Matched case-control
          - name: cohort
            title: Cohort
          - name: nested_cc
            title: Nested case-control
          - name: case_cohort
            title: Case-cohort
          - name: prognosis
            title: Prognosis (patient cohort)
          - name: diagnostic
            title: Diagnostic accuracy
          - name: method_comparison
            title: Method comparison
          - name: rct
            title: Randomised trial
          - name: cluster_rct
            title: Cluster randomised trial
          - name: factorial
            title: 2x2 factorial trial
          - name: crossover
            title: 2x2 crossover trial
          - name: longitudinal
            title: Longitudinal trial (repeated visits)
          - name: pre_post
            title: Before-after (single group)
      default: any
      description:
          R: shows in the pickers only the scenarios (and outcomes) that fit this design

    - name: scenario
      title: Scenario
      type: String
      default: "breast_cancer_risk"
      description:
          R: scenario id

    - name: outcome
      title: Outcome
      type: String
      default: ""
      description:
          R: outcome id; empty means the scenario's first outcome

    - name: design
      title: Design
      type: List
      options:
          - name: cross_sectional
            title: Cross-sectional
          - name: ecological
            title: Ecological (regions)
          - name: case_control
            title: Case-control
          - name: matched_cc
            title: Matched case-control
          - name: cohort
            title: Cohort
          - name: nested_cc
            title: Nested case-control
          - name: case_cohort
            title: Case-cohort
          - name: prognosis
            title: Prognosis (patient cohort)
          - name: diagnostic
            title: Diagnostic accuracy
          - name: method_comparison
            title: Method comparison
          - name: rct
            title: Randomised trial
          - name: cluster_rct
            title: Cluster randomised trial
          - name: factorial
            title: 2x2 factorial trial
          - name: crossover
            title: 2x2 crossover trial
          - name: longitudinal
            title: Longitudinal trial (repeated visits)
          - name: pre_post
            title: Before-after (single group)
      default: case_control
      description:
          R: study design; must fit the outcome

    - name: secondary
      title: Other outcomes of the scenario (same people)
      type: Bool
      default: false
      description:
          R: adds the scenario's other outcomes as columns, for the same people (cross-sectional, cohort, prognosis and trial designs)

    - name: measured
      title: Variables
      type: Array
      default: []
      template:
          type: Group
          elements:
              - name: var
                type: String
              - name: units
                type: String
                default: ""
              - name: include
                type: Bool
                default: false
              - name: form
                type: List
                options:
                    - name: continuous
                      title: continuous
                    - name: median
                      title: median split
                    - name: tertiles
                      title: tertiles
                    - name: quartiles
                      title: quartiles
                    - name: quintiles
                      title: quintiles
                    - name: cuts
                      title: cuts
                    - name: log2
                      title: log2
                    - name: log10
                      title: log10
                    - name: scale
                      title: scale
                default: continuous
              - name: cuts
                type: String
                default: ""
      description:
          R: >
              one entry per scenario variable, list(var = name, include = TRUE/FALSE,
              form = "continuous"/"median"/"tertiles"/"quartiles"/"quintiles"/"cuts"/"log2"/"log10"/"scale",
              cuts = "18.5, 25, 30" or "10%, 90%", or the divisor for scale, e.g. "10"); included variables are in the
              dataset, the others are unmeasured (they still act); form groups a
              continuous variable (quantiles from the sample)

    - name: n
      title: Sample size
      type: Integer
      default: 500
      min: 10
      max: 200000
      description:
          R: number of participants (cases plus controls in case-control designs)

    - name: ccRatio
      title: Controls per case
      type: Integer
      default: 1
      min: 1
      max: 5

    - name: followup
      title: Follow-up (years)
      type: Number
      default: 0
      min: 0
      max: 50
      description:
          R: 0 uses the scenario's default

    - name: loss
      title: Loss to follow-up (% per year)
      type: Number
      default: 2
      min: 0
      max: 50

    - name: accrual
      title: Recruitment period (years)
      type: Number
      default: 0
      min: 0
      max: 20
      description:
          R: 0 uses the design's default (staggered entry for prognosis)

    - name: subcohort
      title: Subcohort (% of the cohort)
      type: Number
      default: 10
      min: 0.1
      max: 90
      description:
          R: case-cohort design, the random subcohort as a percentage of the cohort

    - name: looks
      title: Interim looks
      type: Integer
      default: 0
      min: 0
      max: 5
      description:
          R: randomised trial, number of equally spaced analyses (2 to 5; 0 or 1 = none); adds a look column

    - name: clusters
      title: Clusters
      type: Integer
      default: 20
      min: 4
      max: 1000
      description:
          R: cluster randomised trial, number of clusters (randomised by cluster)

    - name: icc
      title: Intraclass correlation
      type: Number
      default: 0.05
      min: 0
      max: 0.9

    - name: interaction
      title: Interaction of the two interventions
      type: Number
      default: 0
      description:
          R: 2x2 factorial trial, added to the linear predictor of those given both (beta, or log OR/HR/RR)

    - name: visits
      title: Follow-up visits
      type: Integer
      default: 4
      min: 1
      max: 12
      description:
          R: longitudinal trial, number of visits after baseline (the last one is the outcome's time)

    - name: dropout
      title: Dropout by the last visit (%)
      type: Number
      default: 20
      min: 0
      max: 80
      description:
          R: longitudinal trial, participants missing the last visit; dropout depends on the last value seen (missing at random)

    - name: regions
      title: Regions
      type: Integer
      default: 30
      min: 3
      max: 500
      description:
          R: ecological study, number of regions (rows); the sample size is not used

    - name: regionSize
      title: People per region
      type: Integer
      default: 2000
      min: 10
      max: 100000

    - name: regionSd
      title: Differences between regions (exposures)
      type: Number
      default: 0.5
      min: 0
      max: 2
      description:
          R: ecological study, SD of the regions' shifts of the variables (latent standard-normal scale)

    - name: contextSd
      title: Differences between regions (outcome)
      type: Number
      default: 0.2
      min: 0
      max: 2
      description:
          R: ecological study, SD of an unexplained region effect on the outcome (linear predictor scale)

    - name: threshold
      title: Enrol only above percentile
      type: Number
      default: 0
      min: 0
      max: 95
      description:
          R: before-after study, enrol only people whose value before is above this percentile (0 = everybody)

    - name: mcBias
      title: Bias of method B
      type: Number
      default: 0
      description:
          R: method comparison, constant difference B - A in the outcome's units (0 = scenario's value)

    - name: mcSlope
      title: Proportional bias of method B (slope)
      type: Number
      default: 1
      min: 0.5
      max: 2
      description:
          R: method comparison, B per unit of the true value (1 = scenario's value)

    - name: mcErrorA
      title: Error of method A (% of SD)
      type: Number
      default: 0
      min: 0
      max: 100
      description:
          R: method comparison, random error of A as a percentage of the outcome's SD (0 = scenario's value)

    - name: mcErrorB
      title: Error of method B (% of SD)
      type: Number
      default: 0
      min: 0
      max: 100

    - name: period
      title: Period effect
      type: Number
      default: 0

    - name: carryover
      title: Carryover effect
      type: Number
      default: 0

    - name: missing
      title: Missing values (%)
      type: Number
      default: 0
      min: 0
      max: 60

    - name: missingMech
      title: Missingness
      type: List
      options:
          - name: mcar
            title: Completely at random
          - name: mar
            title: Depending on the outcome
          - name: mnar
            title: Depending on the missing value itself
      default: mcar

    - name: reliability
      title: Reliability of numeric measures
      type: Number
      default: 1
      min: 0.2
      max: 1
      description:
          R: share of the observed variance that is true variance (1 = no measurement error)

    - name: misclass
      title: Misclassified categories (%)
      type: Number
      default: 0
      min: 0
      max: 40

    - name: entryErrors
      title: Data-entry errors (%)
      type: Number
      default: 0
      min: 0
      max: 10
      description:
          R: share of numeric cells with a typing error (decimal slip, swapped digits, 999)

    - name: lodHandling
      title: Values below the detection limit
      type: List
      options:
          - name: missing
            title: Reported as missing
          - name: half
            title: Replaced by LOD/2
          - name: lod
            title: Replaced by the LOD
          - name: none
            title: Kept (no limit)
      default: missing
      description:
          R: assays with a limit of detection in the library (lod)

    - name: batches
      title: Assay batches (markers)
      type: Integer
      default: 0
      min: 0
      max: 20

    - name: batchCv
      title: Variation between batches (%)
      type: Number
      default: 15
      min: 0
      max: 100

    - name: batchConfounded
      title: Cases and controls in separate batches
      type: Bool
      default: false

    - name: noiseVars
      title: Extra variables with no effect
      type: Integer
      default: 0
      min: 0
      max: 50

    - name: seed
      title: Seed
      type: Integer
      default: 1
      min: 1
      max: 99999999

    - name: studentKey
      title: Student key
      type: String
      default: ""
      description:
          R: any text (e.g. a student ID); each key gives a different dataset

    - name: showDictionary
      title: Data dictionary
      type: Bool
      default: true

    - name: showDescriptives
      title: Descriptives
      type: Bool
      default: true

    - name: showDag
      title: Causal diagram (DAG)
      type: Bool
      default: true

    - name: dagValues
      title: Effect sizes on the diagram
      type: Bool
      default: true

    - name: showKey
      title: Answer key
      type: Bool
      default: false

    - name: openData
      title: Open dataset
      type: Action
      action: open

    - name: exportCsv
      title: Export CSV
      type: Action
      action: openExternal

    - name: exportKey
      title: Answer key report
      type: Action
      action: openExternal
      description:
          R: saves the answer key (true model, expected estimates, diagram, notes) as an HTML page for the teacher
...
