---
name: simStudy
title: Simulated study
jrs: '1.1'

items:
    - name: notice
      title: ''
      type: Html
      visible: false
      clearWith: &gen [libContent, scenario, outcome, design, secondary, measured, n, ccRatio, followup, loss,
                       accrual, subcohort, looks, clusters, icc, interaction, visits, dropout, regions, regionSize, regionSd, contextSd, threshold, mcBias, mcSlope, mcErrorA, mcErrorB,
                       period, carryover, missing, missingMech, reliability, misclass, entryErrors, noiseVars, lodHandling,
                       batches, batchCv, batchConfounded, seed,
                       studentKey]

    - name: summary
      title: Study
      type: Html
      clearWith: *gen

    - name: dictionary
      title: Data dictionary
      type: Table
      visible: (showDictionary)
      rows: 0
      clearWith: *gen
      columns:
          - name: name
            title: Variable
            type: text
          - name: description
            title: Description
            type: text
          - name: type
            title: Type
            type: text
          - name: values
            title: Values
            type: text
          - name: missing
            title: Missing
            type: integer

    - name: descriptives
      title: Descriptives
      type: Table
      visible: (showDescriptives)
      rows: 0
      clearWith: *gen
      columns:
          - {name: variable, title: Variable, type: text, combineBelow: true}
          - {name: level, title: Level, type: text}
          - {name: stat, title: Summary, type: text}
          - {name: missing, title: Missing, type: integer}

    - name: dag
      title: Causal diagram
      type: Image
      visible: (showDag)
      width: 600
      height: 420
      renderFun: .plotDag
      clearWith: [libContent, scenario, outcome, design, measured, dagValues]

    - name: keyEffects
      title: 'Answer key: true model'
      type: Table
      visible: (showKey)
      rows: 0
      clearWith: [libContent, scenario, outcome, design, secondary]
      columns:
          - name: outcome
            title: Outcome
            type: text
            combineBelow: true
            visible: (secondary)
          - name: variable
            title: Variable
            type: text
          - name: contrast
            title: Contrast
            type: text
          - name: measure
            title: Measure
            type: text
          - name: value
            title: True value
            type: number
          - name: note
            title: Note
            type: text

    - name: keyExpected
      title: 'Answer key: what this design should estimate'
      type: Table
      visible: (showKey)
      rows: 0
      clearWith: [libContent, scenario, outcome, design, secondary, measured, ccRatio, followup, loss, accrual,
                  subcohort, looks, clusters, icc, interaction, visits, dropout, regions, regionSize, regionSd, contextSd,
                  period, carryover, reliability, misclass, threshold, mcBias, mcSlope, mcErrorA, mcErrorB]
      columns:
          - name: outcome
            title: Outcome
            type: text
            combineBelow: true
            visible: (secondary)
          - name: variable
            title: Variable
            type: text
          - name: contrast
            title: Contrast
            type: text
          - name: truth
            title: 'True'
            type: number
          - name: crude
            title: Crude
            type: number
          - name: adjusted
            title: Adjusted
            type: number
          - name: measure
            title: Estimate
            type: text
          - name: note
            title: Note
            type: text

    - name: keyMarkers
      title: 'Answer key: markers'
      type: Table
      visible: (showKey)
      rows: 0
      clearWith: [libContent, scenario, outcome, design]
      columns:
          - name: marker
            title: Marker
            type: text
          - name: part
            title: Columns
            type: text
          - name: nm
            title: N
            type: integer
          - name: truth
            title: True AUC
            type: number
          - name: expected
            title: Large study
            type: number

    - name: keyNotes
      title: 'Answer key: notes'
      type: Html
      visible: (showKey)
      clearWith: *gen

    # once-only guards for the two buttons: a hidden cell that survives re-runs
    # (Action options can stay TRUE across runs; see the jamovi skill).
    - name: openState
      title: ''
      type: Table
      visible: false
      rows: 0
      clearWith: *gen
      columns:
          - {name: fired, title: '', type: text}

    - name: csvState
      title: ''
      type: Table
      visible: false
      rows: 0
      clearWith: *gen
      columns:
          - {name: fired, title: '', type: text}

    - name: keyState
      title: ''
      type: Table
      visible: false
      rows: 0
      clearWith: *gen
      columns:
          - {name: fired, title: '', type: text}
...
