---
title: Study Simulator
name: studysim
version: 0.3.0
jms: '1.0'
authors:
  - Victor Moreno
maintainer: Victor Moreno <v.moreno@iconcologia.net>
date: '1970-01-01'
type: R
description: Simulates plausible medical study datasets for teaching
analyses:
  - title: Simulated study
    name: simStudy
    ns: studysim
    category: analyses
    menuGroup: Simulate
    menuTitle: Simulated study
    menuSubtitle: Scenario, design, dataset and answer key
    description: >
      Simulates a plausible medical study for teaching: a clinical scenario from
      the library, a study design compatible with its outcome, a sample size and
      some realism. The dataset opens in a new window; the answer key holds the
      true parameters and what the design is expected to estimate.
  - title: Compare designs
    name: simCompare
    ns: studysim
    category: analyses
    menuGroup: Simulate
    menuTitle: Compare designs
    menuSubtitle: One scenario, several designs, same population
    description: >
      Simulates one scenario under several study designs from the same
      superpopulation (same seed and student key) and compares what each design
      estimates, with its 95% confidence interval, against the true values. The
      studies can be opened as one dataset with a design column.
  - title: Library
    name: simLibrary
    ns: studysim
    category: analyses
    menuGroup: Simulate
    menuTitle: Library
    menuSubtitle: Import, check, explore and export scenarios
    description: >
      Manages the scenario library of the Study Simulator: reads a custom
      library (YAML, Excel, JSON or a zip of them), checks it, shows its
      scenarios, and exports the library or one scenario as Excel, JSON or YAML,
      or an Excel template to start a new one.
  - title: Derive scenario from data
    name: simDerive
    ns: studysim
    category: analyses
    menuGroup: Simulate
    menuTitle: Derive scenario
    menuSubtitle: Estimate a scenario from the open dataset
    description: >
      Estimates a library scenario from the open dataset: the marginal
      distribution of each variable, their latent correlations and the
      conditional effects on the outcome. Simulated studies from it resemble the
      data. The data cannot tell causes from correlates: the scenario has
      undirected correlations, to be turned into a causal structure before
      teaching (by you, or an AI with the exported file).
usesNative: false
minApp: 28.4.0

...
