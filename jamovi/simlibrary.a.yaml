---
name: simLibrary
title: Library
menuGroup: Simulate
menuTitle: Library
menuSubtitle: Import, check, explore and export scenarios
version: '0.5.0'
jas: '1.2'

description:
    main: >
        Manages the scenario library of the Study Simulator: reads a custom
        library (YAML, Excel, JSON or a zip of them), checks it, shows its
        scenarios, and exports the library or one scenario as Excel, JSON or
        YAML, or an Excel template to start a new one.
    R:
        dontrun: true
        usage: |
            # studysim:::check_library(studysim:::builtin_library())

options:
    - name: data
      type: Data

    - name: libName
      title: Custom library
      type: String
      default: ""

    - name: libContent
      title: Custom library payload
      type: String
      default: ""
      hidden: true

    - name: source
      title: Library shown
      type: List
      options:
          - name: merged
            title: Built-in and custom
          - name: builtin
            title: Built-in only
          - name: custom
            title: Custom only
      default: merged

    - name: designFilter
      title: Scenarios for design
      type: List
      options:
          - name: any
            title: Any design
          - name: cross_sectional
            title: Cross-sectional
          - name: ecological
            title: Ecological (regions)
          - name: case_control
            title: Case-control
          - name: matched_cc
            title: Matched case-control
          - name: cohort
            title: Cohort
          - name: nested_cc
            title: Nested case-control
          - name: case_cohort
            title: Case-cohort
          - name: prognosis
            title: Prognosis (patient cohort)
          - name: diagnostic
            title: Diagnostic accuracy
          - name: method_comparison
            title: Method comparison
          - name: rct
            title: Randomised trial
          - name: cluster_rct
            title: Cluster randomised trial
          - name: factorial
            title: 2x2 factorial trial
          - name: crossover
            title: 2x2 crossover trial
          - name: longitudinal
            title: Longitudinal trial (repeated visits)
          - name: pre_post
            title: Before-after (single group)
      default: any
      description:
          R: lists only the scenarios with an outcome that fits this design

    - name: scenario
      title: Scenario
      type: String
      default: "breast_cancer_risk"

    - name: showScenarios
      title: Scenarios
      type: Bool
      default: true

    - name: showProblems
      title: Check
      type: Bool
      default: true

    - name: showDetails
      title: Selected scenario
      type: Bool
      default: true

    - name: exportFormat
      title: Format
      type: List
      options:
          - name: xlsx
            title: Excel workbook
          - name: json
            title: JSON (for the Simulated study pickers)
          - name: yaml
            title: YAML files (zip)
      default: xlsx

    - name: exportScope
      title: Export
      type: List
      options:
          - name: all
            title: Whole library
          - name: scenario
            title: Selected scenario
      default: all

    - name: teacherCode
      title: Teacher code
      type: String
      default: ""
      description:
          R: >
              unlocks a library locked with this code; a library exported with a code is locked with it
              (its answer keys, true values and effects then need the code)

    - name: exportLib
      title: Export library
      type: Action
      action: openExternal

    - name: exportTemplate
      title: Excel template
      type: Action
      action: openExternal
...
