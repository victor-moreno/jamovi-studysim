title: Derive scenario from data
name: simDerive
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Outcome
        children:
          - type: VariablesListBox
            name: outcome
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Follow-up time (event outcomes)
        children:
          - type: VariablesListBox
            name: time
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Variables
        children:
          - type: VariablesListBox
            name: covs
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: outcomeType
      - type: CheckBox
        name: logOutcome
      - type: ComboBox
        name: missingMethod
      - type: TextBox
        name: imputations
        format: number
        enable: (missingMethod:multiple)
      - type: TextBox
        name: scenarioId
        format: string
        width: large
      - type: TextBox
        name: scenarioLabel
        format: string
        width: large
      - type: TextBox
        name: sourceName
        format: string
        width: large
      - type: CheckBox
        name: validate
  - type: Label
    label: Export
    children:
      - type: ComboBox
        name: exportFormat
      - type: ActionButton
        name: exportScenario
