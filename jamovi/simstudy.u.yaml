title: Simulated study
name: simStudy
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: libName
        label: Custom library
        format: string
        width: large
      - type: ComboBox
        name: designFilter
      - type: TextBox
        name: scenario
        format: string
        width: large
      - type: TextBox
        name: outcome
        format: string
        width: large
      - type: ComboBox
        name: design
  - type: ListBox
    name: measured
    showColumnHeaders: true
    fullRowSelect: true
    stretchFactor: 1
    height: large
    columns:
      - name: var
        label: Variable
        stretchFactor: 1
        selectable: false
        template:
          type: Label
      - name: units
        label: Units or categories
        maxWidth: 150
        selectable: false
        template:
          type: Label
      - name: include
        label: Measured
        maxWidth: 70
        selectable: false
        template:
          type: CheckBox
      - name: form
        label: Form
        maxWidth: 95
        selectable: false
        template:
          type: ComboBox
      - name: cuts
        label: Cuts / scale
        maxWidth: 110
        selectable: false
        template:
          type: TextBox
          format: string
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: n
        format: number
      - type: ActionButton
        name: openData
      - type: ActionButton
        name: exportCsv
  - type: CollapseBox
    label: Design options
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: ccRatio
            format: number
            enable: (design:case_control || design:matched_cc || design:nested_cc)
          - type: TextBox
            name: followup
            format: number
            enable: (design:cohort || design:prognosis || design:rct || design:nested_cc || design:case_cohort || design:cluster_rct || design:factorial)
          - type: TextBox
            name: loss
            format: number
            enable: (design:cohort || design:prognosis || design:rct || design:nested_cc || design:case_cohort || design:cluster_rct || design:factorial)
          - type: TextBox
            name: accrual
            format: number
            enable: (design:cohort || design:prognosis)
          - type: TextBox
            name: subcohort
            format: number
            enable: (design:case_cohort)
          - type: TextBox
            name: looks
            format: number
            enable: (design:rct)
          - type: TextBox
            name: clusters
            format: number
            enable: (design:cluster_rct)
          - type: TextBox
            name: icc
            format: number
            enable: (design:cluster_rct)
          - type: TextBox
            name: interaction
            format: number
            enable: (design:factorial)
          - type: TextBox
            name: visits
            format: number
            enable: (design:longitudinal)
          - type: TextBox
            name: dropout
            format: number
            enable: (design:longitudinal)
          - type: TextBox
            name: regions
            format: number
            enable: (design:ecological)
          - type: TextBox
            name: regionSize
            format: number
            enable: (design:ecological)
          - type: TextBox
            name: regionSd
            format: number
            enable: (design:ecological)
          - type: TextBox
            name: contextSd
            format: number
            enable: (design:ecological)
          - type: TextBox
            name: threshold
            format: number
            enable: (design:pre_post)
          - type: TextBox
            name: mcBias
            format: number
            enable: (design:method_comparison)
          - type: TextBox
            name: mcSlope
            format: number
            enable: (design:method_comparison)
          - type: TextBox
            name: mcErrorA
            format: number
            enable: (design:method_comparison)
          - type: TextBox
            name: mcErrorB
            format: number
            enable: (design:method_comparison)
          - type: TextBox
            name: period
            format: number
            enable: (design:crossover)
          - type: TextBox
            name: carryover
            format: number
            enable: (design:crossover)
  - type: CollapseBox
    label: Realism
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: missing
            format: number
          - type: ComboBox
            name: missingMech
          - type: TextBox
            name: reliability
            format: number
          - type: TextBox
            name: misclass
            format: number
          - type: TextBox
            name: entryErrors
            format: number
          - type: TextBox
            name: noiseVars
            format: number
          - type: ComboBox
            name: lodHandling
          - type: TextBox
            name: batches
            format: number
            enable: (design:diagnostic)
          - type: TextBox
            name: batchCv
            format: number
            enable: (design:diagnostic)
          - type: CheckBox
            name: batchConfounded
            enable: (design:diagnostic)
  - type: CollapseBox
    label: Output
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: seed
            format: number
          - type: TextBox
            name: studentKey
            format: string
            width: large
          - type: CheckBox
            name: showDictionary
          - type: CheckBox
            name: showDescriptives
          - type: CheckBox
            name: showDag
            children:
              - type: CheckBox
                name: dagValues
                enable: (showDag)
          - type: CheckBox
            name: showKey
