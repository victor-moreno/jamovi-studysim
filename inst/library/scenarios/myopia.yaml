id: myopia
label: {en: "Myopia in children", es: "Miopía en niños", ca: "Miopia en infants"}
domain: ophthalmology
population: {en: "Children aged 5-9 without myopia at entry, Orinda (California), 1989-2001", es: "Niños de 5 a 9 años sin miopía al inicio, Orinda (California), 1989-2001", ca: "Infants de 5 a 9 anys sense miopia a l'inici, Orinda (Califòrnia), 1989-2001"}

# Estimated from the 618 children of the Orinda Longitudinal Study of Myopia
# (R package aplore3, dataset myopia): logistic model of myopia within five
# years on sex, baseline refraction, hours of sport, reading and TV, and
# parental myopia.
variables:
  sex:
    type: binary
    p: 0.49
    levels: [boy, girl]
    label: {en: Sex, es: Sexo, ca: Sexe}
  mother_myopic:
    type: binary
    p: 0.51
    levels: [no, yes]
    label: {en: Mother is myopic, es: Madre miope, ca: Mare miop}
  father_myopic:
    type: binary
    p: 0.50
    levels: [no, yes]
    label: {en: Father is myopic, es: Padre miope, ca: Pare miop}
  sport:
    type: count
    dist: negbin(12, 2.8)
    range: [0, 45]
    units: {en: hours/week, es: horas/semana, ca: hores/setmana}
    label: {en: Sport and outdoor activity, es: Deporte y actividad al aire libre, ca: Esport i activitat a l'aire lliure}
  reading:
    type: count
    dist: negbin(2.8, 1.2)
    range: [0, 20]
    units: {en: hours/week, es: horas/semana, ca: hores/setmana}
    label: {en: Reading for pleasure, es: Lectura por placer, ca: Lectura per plaer}
  tv:
    type: count
    dist: negbin(9, 3.4)
    range: [0, 31]
    units: {en: hours/week, es: horas/semana, ca: hores/setmana}
    label: {en: Television, es: Televisión, ca: Televisió}
  refraction:
    type: continuous
    dist: normal(0.80, 0.63)
    range: [-0.7, 4.4]
    round: 2
    units: {en: dioptres, es: dioptrías, ca: diòptries}
    label: {en: Spherical equivalent refraction at entry, es: Refracción (equivalente esférico) al inicio, ca: Refracció (equivalent esfèric) a l'inici}

structure:
  - [sex, sport, -0.13]
  - [sex, reading, 0.13]
  - [sport, tv, 0.18]
  - [mother_myopic, refraction, -0.18]
  - [father_myopic, refraction, -0.18]
  - [reading, refraction, -0.10]

outcomes:
  myopia:
    type: binary
    label: {en: Myopia within five years, es: Miopía en cinco años, ca: Miopia en cinc anys}
    levels: [no, yes]
    prevalence: 0.13
    designs: [cohort, case_control]
    effects:
      refraction: {OR: 0.146, per: 0.5}
      sex: {OR: 1.71}
      sport: {OR: 0.78, per: 5}
      reading: {OR: 1.06, per: 1}
      mother_myopic: {OR: 2.20}
      father_myopic: {OR: 2.36}

null_variables: [tv]

references:
  - "Zadnik K, Mutti DO, Friedman NE et al. Ocular predictors of the onset of juvenile myopia. Invest Ophthalmol Vis Sci 1999;40:1936-43."
  - "Jones LA, Sinnott LT, Mutti DO et al. Parental history of myopia, sports and outdoor activities, and future myopia. Invest Ophthalmol Vis Sci 2007;48:3524-32."
  - "Data: myopia (R package aplore3), 618 children, 81 incident myopia."

i18n:
  en: {names: {sex: sex, mother_myopic: mother_myopic, father_myopic: father_myopic, sport: sport, reading: reading, tv: tv, refraction: refraction, myopia: myopia},
       levels: {boy: boy, girl: girl}}
  es: {names: {sex: sexo, mother_myopic: madre_miope, father_myopic: padre_miope, sport: deporte, reading: lectura, tv: television, refraction: refraccion, myopia: miopia},
       levels: {boy: niño, girl: niña}}
  ca: {names: {sex: sexe, mother_myopic: mare_miop, father_myopic: pare_miop, sport: esport, reading: lectura, tv: televisio, refraction: refraccio, myopia: miopia},
       levels: {boy: nen, girl: nena}}

teaching:
  en: >
    Children with less hyperopic eyes at entry become myopic far more often: the
    baseline refraction is the strongest predictor and partly carries the
    effect of parental myopia (inherited eye shape) and of reading. Adjusting
    for it leaves only the direct effects. Each myopic parent roughly doubles
    the odds; time outdoors protects, television does not matter. Without the
    baseline refraction, the parents' effect looks stronger (a mediator).
  es: >
    Los niños con ojos menos hipermétropes al inicio se vuelven miopes mucho más:
    la refracción basal es el predictor más fuerte y transmite en parte el efecto
    de la miopía de los padres (forma heredada del ojo) y de la lectura. Ajustar
    por ella deja solo los efectos directos. Cada progenitor miope casi duplica la
    odds; el tiempo al aire libre protege y la televisión no importa. Sin la
    refracción basal, el efecto de los padres parece mayor (un mediador).
  ca: >
    Els infants amb ulls menys hipermetrops a l'inici es tornen miops molt més:
    la refracció basal és el predictor més fort i transmet en part l'efecte de la
    miopia dels pares (forma heretada de l'ull) i de la lectura. Ajustar-hi deixa
    només els efectes directes. Cada progenitor miop gairebé duplica l'odds; el
    temps a l'aire lliure protegeix i la televisió no hi importa. Sense la
    refracció basal, l'efecte dels pares sembla més gran (un mediador).
