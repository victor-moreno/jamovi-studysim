id: sprint_blood_pressure
label: {en: "Intensive blood-pressure control (SPRINT)", es: "Control intensivo de la presión arterial (SPRINT)", ca: "Control intensiu de la pressió arterial (SPRINT)"}
domain: cardiovascular
population: {en: "US adults aged 50 or over with systolic pressure 130-180 mmHg and high cardiovascular risk, without diabetes, 2010-15", es: "Adultos de EE. UU. de 50 años o más con presión sistólica de 130-180 mmHg y alto riesgo cardiovascular, sin diabetes, 2010-15", ca: "Adults dels EUA de 50 anys o més amb pressió sistòlica de 130-180 mmHg i risc cardiovascular alt, sense diabetis, 2010-15"}

# From the published results: primary composite outcome 1.65% vs 2.19% per
# year (HR 0.75); death from any cause 1.06% vs 1.41% per year (HR 0.75, final
# report). Serious adverse events more frequent with intensive treatment:
# acute kidney injury about 4% vs 2.5%, hypotension 2.4% vs 1.4%, syncope 2.3%
# vs 1.7% over about 3 years (teaching values rounded from the 2015 report).
# Covariate effects are teaching values.
variables:
  age: {from: dictionary, dist: "normal(67.9, 9.4)", range: [50, 95]}
  sex: {from: dictionary, p: 0.64}
  black:
    type: binary
    p: 0.30
    levels: [no, yes]
    label: {en: Black, es: Raza negra, ca: Raça negra}
  ckd:
    type: binary
    p: 0.28
    levels: [no, yes]
    label: {en: Chronic kidney disease, es: Enfermedad renal crónica, ca: Malaltia renal crònica}
  prior_cvd:
    type: binary
    p: 0.20
    levels: [no, yes]
    label: {en: Clinical cardiovascular disease, es: Enfermedad cardiovascular clínica, ca: Malaltia cardiovascular clínica}
  sbp0:
    type: continuous
    dist: normal(139.7, 15.6)
    range: [130, 180]
    round: 0
    units: mmHg
    label: {en: Systolic pressure at entry, es: Presión sistólica al inicio, ca: Pressió sistòlica a l'inici}

structure:
  - [age, ckd, 0.30]
  - [age, prior_cvd, 0.25]

interventions:
  target:
    levels: [standard, intensive]
    label: {en: "Systolic target (< 140 vs < 120 mmHg)", es: "Objetivo sistólico (< 140 frente a < 120 mmHg)", ca: "Objectiu sistòlic (< 140 enfront de < 120 mmHg)"}

outcomes:
  cvd_event:
    type: event
    label: {en: "Cardiovascular event (MI, stroke, heart failure, CV death)", es: "Evento cardiovascular (IAM, ictus, insuficiencia cardíaca, muerte CV)", ca: "Esdeveniment cardiovascular (IAM, ictus, insuficiència cardíaca, mort CV)"}
    rate: 0.0219
    window: 3.3
    followup: 3.3
    designs: [rct]
    effects:
      target: {HR: [1, 0.75]}
      age: {HR: 1.05, per: 1}
      sex: {HR: 1.4}
      ckd: {HR: 1.5}
      prior_cvd: {HR: 2.0}
      sbp0: {HR: 1.10, per: 10}
  death:
    type: event
    label: {en: Death from any cause, es: Muerte por cualquier causa, ca: Mort per qualsevol causa}
    rate: 0.0141
    window: 3.3
    followup: 3.3
    link: {outcome: cvd_event, rho: 0.4}
    designs: [rct]
    effects:
      target: {HR: [1, 0.75]}
      age: {HR: 1.08, per: 1}
      sex: {HR: 1.3}
      ckd: {HR: 1.6}
      prior_cvd: {HR: 1.6}
  kidney_injury:
    type: binary
    label: {en: Serious acute kidney injury, es: Lesión renal aguda grave, ca: Lesió renal aguda greu}
    levels: [no, yes]
    prevalence: 0.025
    designs: [rct]
    effects:
      target: {OR: [1, 1.65]}
      age: {OR: 1.03, per: 1}
      ckd: {OR: 2.0}
  hypotension:
    type: binary
    label: {en: Serious hypotension, es: Hipotensión grave, ca: Hipotensió greu}
    levels: [no, yes]
    prevalence: 0.014
    designs: [rct]
    effects:
      target: {OR: [1, 1.7]}
      age: {OR: 1.03, per: 1}
  syncope:
    type: binary
    label: {en: Serious syncope, es: Síncope grave, ca: Síncope greu}
    levels: [no, yes]
    prevalence: 0.017
    link: {outcome: hypotension, rho: 0.5}
    designs: [rct]
    effects:
      target: {OR: [1, 1.35]}
      age: {OR: 1.04, per: 1}

null_variables: [black]

designs:
  rct: {loss: 0.01}

references:
  - "SPRINT Research Group. A randomized trial of intensive versus standard blood-pressure control. N Engl J Med 2015;373:2103-16."
  - "SPRINT Research Group. Final report of a trial of intensive versus standard blood-pressure control. N Engl J Med 2021;384:1921-30."

i18n:
  en: {names: {age: age, sex: sex, black: black, ckd: ckd, prior_cvd: prior_cvd, sbp0: sbp0, target: target, cvd_event: cvd_event, death: death, kidney_injury: kidney_injury, hypotension: hypotension, syncope: syncope},
       levels: {standard: standard, intensive: intensive}}
  es: {names: {age: edad, sex: sexo, black: raza_negra, ckd: erc, prior_cvd: ecv_previa, sbp0: pas_basal, target: objetivo, cvd_event: evento_cv, death: muerte, kidney_injury: lesion_renal, hypotension: hipotension, syncope: sincope},
       levels: {standard: estandar, intensive: intensivo}}
  ca: {names: {age: edat, sex: sexe, black: raca_negra, ckd: mrc, prior_cvd: mcv_previa, sbp0: pas_basal, target: objectiu, cvd_event: esdeveniment_cv, death: mort, kidney_injury: lesio_renal, hypotension: hipotensio, syncope: sincope},
       levels: {standard: estandard, intensive: intensiu}}

teaching:
  en: >
    A trial with several outcomes, as most are: a primary composite, death, and
    harms. Intensive control prevented cardiovascular events and deaths but
    caused more kidney injury, hypotension and syncope. Tick the other outcomes
    to get them all for the same patients: weigh benefits against harms
    (numbers needed to treat and to harm), remember that testing many outcomes
    inflates false positives, and that the outcomes of a patient are correlated
    (death with cardiovascular events, syncope with hypotension).
  es: >
    Un ensayo con varias variables de resultado, como la mayoría: una variable
    principal compuesta, la muerte y los daños. El control intensivo previno
    eventos cardiovasculares y muertes pero causó más lesión renal, hipotensión y
    síncopes. Marque las otras respuestas para tenerlas todas en los mismos
    pacientes: compare beneficios y daños (número necesario a tratar y a dañar),
    recuerde que contrastar muchas variables aumenta los falsos positivos y que
    las respuestas de un paciente están correlacionadas (la muerte con los
    eventos cardiovasculares, el síncope con la hipotensión).
  ca: >
    Un assaig amb diverses variables de resultat, com la majoria: una variable
    principal composta, la mort i els danys. El control intensiu va prevenir
    esdeveniments cardiovasculars i morts però va causar més lesió renal,
    hipotensió i síncopes. Marqueu les altres respostes per tenir-les totes en
    els mateixos pacients: compareu beneficis i danys (nombre necessari a tractar
    i a danyar), recordeu que contrastar moltes variables augmenta els falsos
    positius i que les respostes d'un pacient estan correlacionades (la mort amb
    els esdeveniments cardiovasculars, el síncope amb la hipotensió).
