project:
  type: website
  output-dir: ../docs
  execute-dir: project
  resources:
    - screenshots/chd_sim.csv

website:
  title: "studysim"
  description: "Simulated medical studies for teaching, in jamovi"
  repo-url: https://github.com/victor-moreno/jamovi-studysim
  repo-actions: [issue]
  page-navigation: true
  search: true
  sidebar:
    style: docked
    contents:
      - index.qmd
      - simulated-study.qmd
      - teaching.qmd
      - analysis.qmd
      - library.qmd
      - scenarios.qmd
      - derive.qmd
      - how-it-works.qmd
      - section: "Epidemiology guide"
        contents:
          - guide-measures.qmd
          - guide-observational.qmd
          - guide-trials.qmd
          - guide-dags.qmd
          - guide-mediation.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    number-sections: false
    fig-align: center
    css: styles.css

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
